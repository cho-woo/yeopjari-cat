name: Publish Windows-validated stop and artwork review without changing stable updates
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: yeopjari-cat-release-publication
  cancel-in-progress: false
jobs:
  review:
    if: github.repository == 'cho-woo/yeopjari-cat' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 tools/publish_walk_review.py
