name: Build, verify on Windows and prepare v2.0.12 review draft

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yeopjari-cat-release-publication
  cancel-in-progress: false

env:
  VERSION: 2.0.12
  PYTHONUTF8: '1'

jobs:
  build:
    if: github.repository == 'cho-woo/yeopjari-cat' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require the requested source version
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          import release
          assert release.version_from_header(release.ROOT / 'src/app_version.h') == os.environ['VERSION']
          PY
      - name: Install pinned dependencies
        run: bash tools/setup.sh
      - name: Test, build Windows x64 and verify ZIP and update feed
        run: bash tools/check.sh
      - name: Select exactly one verified package
        id: package
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          packages = list(Path('release/publish').glob('check-' + os.environ['VERSION'] + '-*/package'))
          assert len(packages) == 1, packages
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('path=' + str(packages[0]) + '\n')
          PY
      - name: Test publisher permissions and failure safeguards without network
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: '& ./tests/publisher_runtime_test.ps1 -PackagePath $env:PACKAGE_PATH'
      - uses: actions/upload-artifact@v4
        with:
          name: release-v2.0.12-${{ github.sha }}
          path: ${{ steps.package.outputs.path }}/*
          if-no-files-found: error

  windows-smoke:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-v2.0.12-${{ github.sha }}
          path: package
      - name: Verify downloaded package on Windows
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & python -X utf8 tools/release.py --verify package 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $detail = ($output -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            exit $code
          }
      - name: Verify no audio resources or playback imports in the packaged EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path "package/YeopjariCat-$env:VERSION.exe").Path
          & python -X utf8 tools/verify_silent_exe.py $exe
          if ($LASTEXITCODE -ne 0) {
            throw "Silent executable verification failed with exit code $LASTEXITCODE."
          }
      - name: Execute the Windows x64 binary self-test
        id: selftest
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path "package/YeopjariCat-$env:VERSION.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Write-Host "::error::Windows self-test failed: $($process.ExitCode)"
            throw "Windows self-test failed with exit code $($process.ExitCode)."
          }
          Write-Host 'Windows x64 save-state, life/toy and cursor host self-tests passed.'
      - name: Render real Windows GDI+ motion, retired-wardrobe and contact regressions
        if: ${{ !cancelled() && (steps.selftest.outcome == 'success' || steps.selftest.outcome == 'failure') }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path "package/YeopjariCat-$env:VERSION.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList '--render-self-test' -PassThru -Wait
          $report = if (Test-Path render-self-test.txt) { Get-Content render-self-test.txt -Raw } else { "No native render report produced." }
          Write-Host $report
          if ($process.ExitCode -ne 0) {
            $detail = $report.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            throw "Native Windows render test failed with exit code $($process.ExitCode)."
          }
          Write-Host 'Native GDI+ motion, intact walking drawings, posture transitions, 10 species, retained outfit keys without overlays, expressions and both pet input tests passed.'

      - name: Require native walking review images
        shell: pwsh
        run: |
          foreach ($name in @('walk-cream-gdi.png', 'walk-silver-gdi.png')) {
            $path = Join-Path 'render-self-test' $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing native GDI+ walking capture: $name"
            }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: native-walk-review-v2.0.12-${{ github.sha }}
          path: |
            render-self-test/walk-cream-gdi.png
            render-self-test/walk-silver-gdi.png
          if-no-files-found: error

  publish:
    needs: [build, windows-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-v2.0.12-${{ github.sha }}
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: native-walk-review-v2.0.12-${{ github.sha }}
          path: native-review
      - name: Reverify the exact tested package
        run: python3 tools/release.py --verify package
      - name: Bind native review images to the draft publisher
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil, struct, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import release
          package = Path('package')
          info = release.verify_release(package)
          hashes = dict(info['files'])
          names = {'walk-cream-gdi.png', 'walk-silver-gdi.png'}
          captures = list(Path('native-review').rglob('*.png'))
          assert len(captures) == len(names) and {p.name for p in captures} == names
          for path in captures:
              payload = path.read_bytes()
              assert 32 <= len(payload) <= 20 * 1024 * 1024
              assert payload[:8] == b'\x89PNG\r\n\x1a\n' and payload[12:16] == b'IHDR'
              width, height = struct.unpack('>II', payload[16:24])
              assert 100 <= width <= 8192 and 100 <= height <= 8192
              hashes[path.name] = hashlib.sha256(payload).hexdigest()
              shutil.copyfile(path, package / path.name)
          # Preserve the original generated package publisher and all package
          # hashes. The auxiliary publisher verifies the two review assets too.
          (package / 'publish-reviewed-draft.ps1').write_text(
              release.publisher_script(info['github_repository'], info['version'], hashes),
              encoding='utf-8-sig', newline='\r\n')
          release.verify_release(package)
          print(json.dumps({'source_commit': __import__('os').environ['GITHUB_SHA'],
                            'verified_draft_asset_sha256': hashes}, indent=2))
          PY
      - name: Bind the draft to this tested source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'cho-woo/yeopjari-cat'
          $tag = 'v' + $env:VERSION
          & gh api "repos/$repo" --jq '.permissions'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect publishing permissions.' }
          $json = & gh release list --repo $repo --limit 1000 --json tagName,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release history.' }
          $history = @($json | ConvertFrom-Json)
          if ($history.Count -ge 1000) { throw 'Release history exceeds the bounded check.' }
          $existing = @($history | Where-Object { $_.tagName -eq $tag })
          if ($existing.Count -gt 1) { throw 'Ambiguous release.' }
          if ($existing.Count -eq 0) {
            & gh release create $tag --repo $repo --draft --target $env:GITHUB_SHA --title "Yeopjari Cat $env:VERSION" --notes-file package/RELEASE_NOTES_KO.txt
          } else {
            if (-not $existing[0].isDraft -or $existing[0].isPrerelease) {
              throw 'The existing release is public or a prerelease. Nothing will be overwritten.'
            }
            & gh release edit $tag --repo $repo --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot bind draft to tested commit.' }
          $json = & gh release view $tag --repo $repo --json isDraft,isPrerelease,targetCommitish
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify draft target.' }
          $draft = $json | ConvertFrom-Json
          if (-not $draft.isDraft -or $draft.isPrerelease -or $draft.targetCommitish -ne $env:GITHUB_SHA) {
            throw 'Draft does not match this tested commit.'
          }
          $json = & gh api "repos/$repo/git/matching-refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing release tag.' }
          $refs = @($json | ConvertFrom-Json | Where-Object { $_.ref -eq "refs/tags/$tag" })
          if ($refs.Count -gt 1) { throw 'Ambiguous release tag.' }
          if ($refs.Count -eq 1) {
            $resolved = & gh api "repos/$repo/commits/$tag" --jq '.sha'
            if ($LASTEXITCODE -ne 0 -or $resolved -ne $env:GITHUB_SHA) {
              throw 'Existing tag does not point to this tested commit.'
            }
          }
      - name: Upload and hash-check the package and native review images as a draft
        shell: pwsh
        run: |
          try {
            # Deliberately omit -Publish. Review these exact native captures
            # before making this tested draft visible to the stable updater.
            & ./package/publish-reviewed-draft.ps1
          } catch {
            $detail = ($_ | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            throw
          }
      - name: Confirm the exact tested draft remains unpublished
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          info = json.loads(Path('package/release-info.json').read_text())
          repo = info['github_repository']
          tag = 'v' + info['version']
          draft = json.loads(subprocess.check_output([
              'gh', 'release', 'view', tag, '--repo', repo,
              '--json', 'isDraft,isPrerelease,targetCommitish,assets,url']))
          assert draft['isDraft'] and not draft['isPrerelease']
          assert draft['targetCommitish'] == os.environ['GITHUB_SHA']
          assert {asset['name'] for asset in draft['assets']} == set(info['files']) | {
              'walk-cream-gdi.png', 'walk-silver-gdi.png'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Verified draft ready for native image review\n\n')
              output.write('Source: `' + os.environ['GITHUB_SHA'] + '`\n\n')
              output.write('All package and native image downloads were hash-checked. ')
              output.write('This workflow does not publish or change the latest feed.\n\n')
              output.write('Inspect `walk-cream-gdi.png` and `walk-silver-gdi.png` from this draft; ')
              output.write('then publish this exact tested draft and verify public downloads and the official latest feed.\n')
          print('Verified unpublished draft:', draft['url'])
          PY
