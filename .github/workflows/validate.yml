name: Validate source, Windows x64 build and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned build dependencies
        run: bash tools/setup.sh
      - name: Test, build and verify local package and feed
        run: bash tools/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-validated-package
          path: release/publish/check-*/package/*
          if-no-files-found: error
