name: Validate source, Windows x64 build and package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned build dependencies
        run: |
          set +e
          bash tools/setup.sh > /tmp/yeopjari-setup.log 2>&1
          code=$?
          cat /tmp/yeopjari-setup.log
          if [ "$code" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          text = Path('/tmp/yeopjari-setup.log').read_text(errors='replace')[-3500:]
          print('::error::' + text.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))
          PY
            exit "$code"
          fi
      - name: Test, build and verify local package and feed
        run: bash tools/check.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-validated-package
          path: release/publish/check-*/package/*
          if-no-files-found: error

  windows-smoke:
    needs: validate
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64-validated-package
          path: package
      - name: Verify the exact Windows package and silent executable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          # The validation upload uses check-*/package/*, so the artifact can
          # retain those subdirectories. Require one package at any depth.
          $metadata = @(Get-ChildItem -Path package -Filter release-info.json -Recurse -File)
          if ($metadata.Count -ne 1) { throw "Expected one validated package, found $($metadata.Count)." }
          $package = Split-Path -Parent $metadata[0].FullName
          $output = & python -X utf8 tools/release.py --verify $package 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $detail = ($output -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            exit $code
          }
          $info = Get-Content $metadata[0].FullName -Raw | ConvertFrom-Json
          $exe = (Resolve-Path (Join-Path $package "YeopjariCat-$($info.version).exe")).Path
          & python -X utf8 tools/verify_silent_exe.py $exe
          if ($LASTEXITCODE -ne 0) { throw 'Silent executable check failed.' }
          "TEST_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compare baseline and candidate on the same Windows desktop
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            New-Item -ItemType Directory -Path benchmark-baseline | Out-Null
            try {
              Invoke-WebRequest 'https://github.com/cho-woo/yeopjari-cat/releases/download/v2.0.15/YeopjariCat-2.0.15.exe' -OutFile benchmark-baseline/YeopjariCat-2.0.15.exe
            } catch {
              # Same immutable baseline through GitHub's asset endpoint when
              # its release redirect returns a gateway failure. Hash below is
              # mandatory for both transports.
              Invoke-WebRequest 'https://api.github.com/repos/cho-woo/yeopjari-cat/releases/assets/725958295' -Headers @{ Accept = 'application/octet-stream' } -OutFile benchmark-baseline/YeopjariCat-2.0.15.exe
            }
            $old = (Resolve-Path benchmark-baseline/YeopjariCat-2.0.15.exe).Path
            if ((Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7b5fd64493ab4241bb932d01c630558c0da242e30ef54b17a61b808147e6d266') { throw 'Baseline hash mismatch' }
            $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/benchmark_windows.ps1 -OldExe $old -NewExe $env:TEST_EXE -OutputDirectory native-benchmark -DisposableProfile -IdleSeconds 8 -ActiveSeconds 12 -SwitchCycles 6 -SettleSeconds 5 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { throw ($output -join "`n") }
          } catch {
            $detail = ($_ | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            throw
          }
      - name: Execute Windows save, cursor and moving-window regression tests
        if: ${{ !cancelled() }}
        id: selftest
        timeout-minutes: 2
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:TEST_EXE -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Write-Host "::error::Windows self-test failed: $($process.ExitCode)"
            throw "Windows self-test failed: $($process.ExitCode)"
          }
      - name: Render real Windows GDI+ gait, contact and posture regressions
        if: ${{ !cancelled() && (steps.selftest.outcome == 'success' || steps.selftest.outcome == 'failure') }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          $process = Start-Process -FilePath $env:TEST_EXE -ArgumentList '--render-self-test' -PassThru -Wait
          $report = if (Test-Path render-self-test.txt) { Get-Content render-self-test.txt -Raw } else { 'No native render report produced.' }
          Write-Host $report
          if ($process.ExitCode -ne 0) {
            $detail = $report.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            throw "Windows render test failed: $($process.ExitCode)"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-validation
          path: |
            render-self-test.txt
            render-self-test/
            native-benchmark/
          if-no-files-found: ignore
