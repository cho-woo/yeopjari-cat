name: Build, verify on Windows and prepare v2.0.13 review draft

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yeopjari-cat-release-publication
  cancel-in-progress: false

env:
  VERSION: 2.0.13
  PYTHONUTF8: '1'

jobs:
  build:
    if: github.repository == 'cho-woo/yeopjari-cat' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Require the requested source version
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, 'tools')
          import release
          assert release.version_from_header(release.ROOT / 'src/app_version.h') == os.environ['VERSION']
          PY
      - name: Install pinned dependencies
        run: bash tools/setup.sh
      - name: Test, build Windows x64 and verify ZIP and update feed
        run: bash tools/check.sh
      - name: Select exactly one verified package
        id: package
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          packages = list(Path('release/publish').glob('check-' + os.environ['VERSION'] + '-*/package'))
          assert len(packages) == 1, packages
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('path=' + str(packages[0]) + '\n')
          PY
      - name: Test publisher permissions and failure safeguards without network
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: '& ./tests/publisher_runtime_test.ps1 -PackagePath $env:PACKAGE_PATH'
      - uses: actions/upload-artifact@v4
        with:
          name: release-v2.0.13-${{ github.sha }}
          path: ${{ steps.package.outputs.path }}/*
          if-no-files-found: error

  windows-smoke:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-v2.0.13-${{ github.sha }}
          path: package
      - name: Verify downloaded package on Windows
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & python -X utf8 tools/release.py --verify package 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $detail = ($output -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            exit $code
          }
      - name: Verify no audio resources or playback imports in the packaged EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path "package/YeopjariCat-$env:VERSION.exe").Path
          & python -X utf8 tools/verify_silent_exe.py $exe
          if ($LASTEXITCODE -ne 0) {
            throw "Silent executable verification failed with exit code $LASTEXITCODE."
          }
      - name: Fetch the exact published v2.0.12 benchmark baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path benchmark-baseline | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/cho-woo/yeopjari-cat/releases/download/v2.0.12/YeopjariCat-2.0.12.exe' -OutFile benchmark-baseline/YeopjariCat-2.0.12.exe
          $baseline = Get-Item -LiteralPath benchmark-baseline/YeopjariCat-2.0.12.exe
          if ($baseline.Length -ne 35133952 -or
              (Get-FileHash -LiteralPath $baseline.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -ne '64a324cc776c97e4bd61c254f960769ebb3df56968d56987cae33f8484892cb8') {
            throw 'The downloaded baseline differs from the verified public v2.0.12 executable.'
          }
          & python -X utf8 -c "import sys; from pathlib import Path; sys.path.insert(0, 'tools'); import release; release.inspect_release_exe(Path('benchmark-baseline/YeopjariCat-2.0.12.exe').read_bytes(), '2.0.12')"
          if ($LASTEXITCODE -ne 0) { throw 'Baseline Windows executable identity validation failed.' }
      - name: Measure both actual applications on the same disposable Windows runner
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $old = (Resolve-Path 'benchmark-baseline/YeopjariCat-2.0.12.exe').Path
          $candidate = (Resolve-Path "package/YeopjariCat-$env:VERSION.exe").Path
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/benchmark_windows.ps1 -ValidateOnly
          if ($LASTEXITCODE -ne 0) { throw 'Windows process counters or UI Automation are unavailable.' }
          # Run before any other EXE tests so the disposable profile is pristine.
          # The harness refuses an existing save folder or another cat process.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/benchmark_windows.ps1 -OldExe $old -NewExe $candidate -OutputDirectory native-benchmark -DisposableProfile
          if ($LASTEXITCODE -ne 0) {
            $report = if (Test-Path native-benchmark/failed-result.json) { Get-Content native-benchmark/failed-result.json -Raw } else { 'No benchmark failure report produced.' }
            $detail = $report.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            throw 'The matched ordinary-application benchmark did not complete.'
          }
      - name: Execute the Windows x64 binary self-test
        id: selftest
        timeout-minutes: 2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path "package/YeopjariCat-$env:VERSION.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            Write-Host "::error::Windows self-test failed: $($process.ExitCode)"
            throw "Windows self-test failed with exit code $($process.ExitCode)."
          }
          Write-Host 'Windows x64 save-state, life/toy and cursor host self-tests passed.'
      - name: Render real Windows GDI+ motion, retired-wardrobe and contact regressions
        if: ${{ !cancelled() && (steps.selftest.outcome == 'success' || steps.selftest.outcome == 'failure') }}
        timeout-minutes: 8
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path "package/YeopjariCat-$env:VERSION.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList '--render-self-test' -PassThru -Wait
          $report = if (Test-Path render-self-test.txt) { Get-Content render-self-test.txt -Raw } else { "No native render report produced." }
          Write-Host $report
          if ($process.ExitCode -ne 0) {
            $detail = $report.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            throw "Native Windows render test failed with exit code $($process.ExitCode)."
          }
          Write-Host 'Native GDI+ motion, intact walking drawings, posture transitions, 10 species, retained outfit keys without overlays, expressions and both pet input tests passed.'

      - name: Collect complete native review and measured performance evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path native-review | Out-Null
          foreach ($name in @('walk-cream-gdi.png', 'walk-silver-gdi.png', 'care-sprites-gdi.png', 'care-cache-stress.json')) {
            $path = Join-Path 'render-self-test' $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing native output: $name" }
            Copy-Item -LiteralPath $path -Destination native-review
          }
          foreach ($name in @('v2.0.12-samples.csv', 'candidate-samples.csv', 'performance-summary.png')) {
            $path = Join-Path 'native-benchmark' $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing measured benchmark output: $name" }
            Copy-Item -LiteralPath $path -Destination native-review
          }
          Copy-Item -LiteralPath native-benchmark/result.json -Destination native-review/performance-v2.0.13.json
      - uses: actions/upload-artifact@v4
        with:
          name: native-review-v2.0.13-${{ github.sha }}
          path: native-review/*
          if-no-files-found: error

  publish:
    needs: [build, windows-smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-v2.0.13-${{ github.sha }}
          path: package
      - uses: actions/download-artifact@v4
        with:
          name: native-review-v2.0.13-${{ github.sha }}
          path: native-review
      - name: Reverify the exact tested package
        run: python3 tools/release.py --verify package
      - name: Validate native review and measured performance, then bind draft assets
        run: |
          python3 - <<'PY'
          import hashlib, json, math, os, shutil, struct, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          import release
          package = Path('package')
          info = release.verify_release(package)
          hashes = dict(info['files'])
          names = {'walk-cream-gdi.png', 'walk-silver-gdi.png', 'care-sprites-gdi.png',
                   'care-cache-stress.json', 'performance-v2.0.13.json',
                   'v2.0.12-samples.csv', 'candidate-samples.csv', 'performance-summary.png'}
          captures = [path for path in Path('native-review').rglob('*') if path.is_file()]
          assert len(captures) == len(names) and {path.name for path in captures} == names
          files = {path.name: path for path in captures}
          performance = json.loads(files['performance-v2.0.13.json'].read_text(encoding='utf-8-sig'))
          assert performance['schema'] == 1 and performance['status'] == 'completed'
          assert len(performance['runs']) == 2
          runs = {run['label']: run for run in performance['runs']}
          assert set(runs) == {'v2.0.12', 'candidate'}
          assert runs['v2.0.12']['exe_sha256'] == '64a324cc776c97e4bd61c254f960769ebb3df56968d56987cae33f8484892cb8'
          assert runs['v2.0.12']['exe_bytes'] == 35133952
          candidate = runs['candidate']
          assert candidate['exe_sha256'] == hashes['YeopjariCat-' + info['version'] + '.exe']
          assert candidate['exe_bytes'] == (package / ('YeopjariCat-' + info['version'] + '.exe')).stat().st_size
          assert candidate['file_version'].split('.')[:3] == info['version'].split('.')
          assert performance['conditions']['disposable_profile'] is True
          assert performance['conditions']['logical_processors'] >= 1
          scenario_names = {'paused_idle', 'ordinary_autonomous_activity',
                            'repeated_character_switch', 'post_repeat_idle_settle'}
          for run in runs.values():
              assert math.isfinite(run['startup_ms']) and run['startup_ms'] > 0
              assert run['startup_private_bytes'] > 0
              assert len(run['scenarios']) == 4
              assert {scenario['name'] for scenario in run['scenarios']} == scenario_names
              for scenario in run['scenarios']:
                  assert scenario['wall_seconds'] > 0 and len(scenario['samples']) >= 2
                  for key in ('cpu_seconds', 'cpu_one_core_percent', 'cpu_machine_percent',
                              'private_bytes_peak_sampled', 'working_set_peak_sampled'):
                      assert math.isfinite(scenario[key]) and scenario[key] >= 0
                  if scenario['name'] == 'repeated_character_switch':
                      assert scenario['action_count'] == performance['conditions']['switch_cycles'] == 20
          cache = json.loads(files['care-cache-stress.json'].read_text(encoding='utf-8-sig'))
          assert cache['schema'] == 1 and cache['status'] == 'passed'
          assert cache['test'] == 'native_frame_cache_capacity'
          assert len(cache['cases']) == 3 and {case['frame_count'] for case in cache['cases']} == {64, 128, 256}
          for case in cache['cases']:
              assert case['render_calls'] >= case['frame_count']
              assert case['pointer_reuse'] is True and case['budget_rejection_atomic'] is True
          for path in captures:
              payload = path.read_bytes()
              assert 32 <= len(payload) <= 20 * 1024 * 1024
              if path.suffix == '.png':
                  assert payload[:8] == b'\x89PNG\r\n\x1a\n' and payload[12:16] == b'IHDR'
                  width, height = struct.unpack('>II', payload[16:24])
                  assert 100 <= width <= 8192 and 100 <= height <= 8192
              elif path.suffix == '.csv':
                  assert len(payload.decode('utf-8-sig').splitlines()) >= 3
              hashes[path.name] = hashlib.sha256(payload).hexdigest()
              shutil.copyfile(path, package / path.name)
          # The original generated package publisher remains intact. This
          # auxiliary publisher also verifies every native review/metric file.
          (package / 'publish-reviewed-draft.ps1').write_text(
              release.publisher_script(info['github_repository'], info['version'], hashes),
              encoding='utf-8-sig', newline='\r\n')
          release.verify_release(package)
          print(json.dumps({'source_commit': os.environ['GITHUB_SHA'],
                            'verified_draft_asset_sha256': hashes,
                            'performance_result': 'measured; requires review, no superiority claim'}, indent=2))
          PY
      - name: Bind the draft to this tested source commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'cho-woo/yeopjari-cat'
          $tag = 'v' + $env:VERSION
          & gh api "repos/$repo" --jq '.permissions'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect publishing permissions.' }
          $json = & gh release list --repo $repo --limit 1000 --json tagName,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release history.' }
          $history = @($json | ConvertFrom-Json)
          if ($history.Count -ge 1000) { throw 'Release history exceeds the bounded check.' }
          $existing = @($history | Where-Object { $_.tagName -eq $tag })
          if ($existing.Count -gt 1) { throw 'Ambiguous release.' }
          if ($existing.Count -eq 0) {
            & gh release create $tag --repo $repo --draft --target $env:GITHUB_SHA --title "Yeopjari Cat $env:VERSION" --notes-file package/RELEASE_NOTES_KO.txt
          } else {
            if (-not $existing[0].isDraft -or $existing[0].isPrerelease) {
              throw 'The existing release is public or a prerelease. Nothing will be overwritten.'
            }
            & gh release edit $tag --repo $repo --target $env:GITHUB_SHA
          }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot bind draft to tested commit.' }
          $json = & gh release view $tag --repo $repo --json isDraft,isPrerelease,targetCommitish
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify draft target.' }
          $draft = $json | ConvertFrom-Json
          if (-not $draft.isDraft -or $draft.isPrerelease -or $draft.targetCommitish -ne $env:GITHUB_SHA) {
            throw 'Draft does not match this tested commit.'
          }
          $json = & gh api "repos/$repo/git/matching-refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect existing release tag.' }
          $refs = @($json | ConvertFrom-Json | Where-Object { $_.ref -eq "refs/tags/$tag" })
          if ($refs.Count -gt 1) { throw 'Ambiguous release tag.' }
          if ($refs.Count -eq 1) {
            $resolved = & gh api "repos/$repo/commits/$tag" --jq '.sha'
            if ($LASTEXITCODE -ne 0 -or $resolved -ne $env:GITHUB_SHA) {
              throw 'Existing tag does not point to this tested commit.'
            }
          }
      - name: Upload and hash-check the package, native images and performance evidence as a draft
        shell: pwsh
        run: |
          try {
            # Deliberately omit -Publish. Review these exact native captures
            # before making this tested draft visible to the stable updater.
            & ./package/publish-reviewed-draft.ps1
          } catch {
            $detail = ($_ | Out-String).Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error::$detail"
            throw
          }
      - name: Confirm the exact tested draft remains unpublished
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          info = json.loads(Path('package/release-info.json').read_text())
          repo = info['github_repository']
          tag = 'v' + info['version']
          draft = json.loads(subprocess.check_output([
              'gh', 'release', 'view', tag, '--repo', repo,
              '--json', 'isDraft,isPrerelease,targetCommitish,assets,url']))
          assert draft['isDraft'] and not draft['isPrerelease']
          assert draft['targetCommitish'] == os.environ['GITHUB_SHA']
          assert {asset['name'] for asset in draft['assets']} == set(info['files']) | {
              'walk-cream-gdi.png', 'walk-silver-gdi.png', 'care-sprites-gdi.png',
              'care-cache-stress.json', 'performance-v2.0.13.json',
              'v2.0.12-samples.csv', 'candidate-samples.csv', 'performance-summary.png'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('## Verified draft ready for native image and performance review\n\n')
              output.write('Source: `' + os.environ['GITHUB_SHA'] + '`\n\n')
              output.write('All package, native image and measured performance downloads were hash-checked. ')
              output.write('This workflow does not publish or change the latest feed.\n\n')
              output.write('Inspect the three native GDI+ montages, measured old/new performance and synthetic cache report from this draft; ')
              output.write('then publish this exact tested draft and verify public downloads and the official latest feed.\n')
          print('Verified unpublished draft:', draft['url'])
          PY
