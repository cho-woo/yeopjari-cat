plugins { id 'com.android.application' }
android {
    namespace 'com.valuewander.yeopjaricat'
    compileSdk 36
    defaultConfig {
        applicationId 'com.valuewander.yeopjaricat'
        minSdk 26
        targetSdk 36
        versionCode = (project.findProperty('previewVersionCode') ?: '8').toString().toInteger()
        versionName = (project.findProperty('previewVersionName') ?: '0.4.2-preview').toString()
        testInstrumentationRunner 'com.valuewander.yeopjaricat.MotionSmoke'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    lint { abortOnError true; checkReleaseBuilds true }
}
